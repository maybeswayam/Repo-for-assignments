<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2 Scalex Design</title>
    <link rel="stylesheet" href="design1_style.css">
</head>
<body class="drak-mod-body">

    <!-- top nav menu -->
    <nav class="flx-nav">
        <div class="logo-boxx">
            <!-- absolute positioning used here for the little shape -->
            <div class="scale-icn"></div> 
            <h2>ScaleX</h2>
        </div>
        
        <ul class="navv-links">
            <li>Home</li>
            <li>About Us</li>
            <li>Blogs</li>
            <li>Contact Us</li>
        </ul>

        <button class="gtt-startd">Get Started</button>
    </nav>

    <!-- hero section with big text -->
    <header class="hero-sectin">
        <h1 class="megga-txt">Insights & Blogs</h1>
        
        <div class="pills-containr">
            <div class="pill-btn actv">All</div>
            <div class="pill-btn">Stadiums</div>
            <div class="pill-btn">Players</div>
            <div class="pill-btn">Jerseys</div>
        </div>
    </header>

    <!-- cards grid flexbox -->
    <main class="grid-wrap">
        
        <!-- crd 1 -->
        <div class="crdd">
            <!-- image from unsplash -->
            <img class="img-top" src="https://images.unsplash.com/photo-1674760726595-d12f5e45482a?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="football gd 1">
            <div class="crd-bttm">
                <span class="sall-badge">Barcelona</span>
                <h3 class="crd-title">The Ultimate Guide Camp NOU</h3>
                <p class="littl-datte">May 23, 2025</p>
            </div>
        </div>

        <!-- crd 2 -->
        <div class="crdd">
            <img class="img-top" src="https://images.unsplash.com/photo-1610065132656-bbb6b4bf0da1?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8UFNHfGVufDB8fDB8fHww" alt="football gd 2">
            <div class="crd-bttm">
                <span class="sall-badge">PSG</span>
                <h3 class="crd-title">How can we forget PSG</h3>
                <p class="littl-datte">May 23, 2025</p>
            </div>
        </div>

        <!-- crd 3 -->
        <div class="crdd">
            <img class="img-top" src="https://images.unsplash.com/photo-1642763907630-17bad0853f15?q=80&w=1374&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="football gd 3">
            <div class="crd-bttm">
                <span class="sall-badge">MAN United</span>
                <h3 class="crd-title">How Important Old trafford is</h3>
                <p class="littl-datte">May 23, 2025</p>
            </div>
        </div>
    </main>
</body>
</html>
